name: my-first-nest
# 用于启动已经构建好的镜像
services:
  app:
    container_name: my-first-nest-app-local
    image: my-first-nest:latest
    restart: on-failure:5
    ports:
      - "3000:80"
    volumes:
      - upload-data:/app/uploads
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@my-first-nest-db:5432/first-nest
      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_PASSWORD: admin1234
      JWT_SECRET: my-first-nest-jwt-secret
      UPLOAD_SIGNATURE_SECRET: my-first-nest-upload-signature-secret
      UPLOAD_DIR: /app/uploads
      # 若同时启动了 docker-compose.cache.yml，会通过 my-nest-network 解析到 redis 服务
      REDIS_URL: redis://redis:6379
      SEQ_ENABLED: "true"
      SEQ_URL: http://seq
      SEQ_TIMEOUT_MS: 5000
    networks:
      - my-nest-network

volumes:
  upload-data:

networks:
  my-nest-network:
    external: true
    name: my-nest-network
