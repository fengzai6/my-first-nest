name: my-first-nest

services:
  seq:
    image: datalust/seq:latest
    container_name: my-first-nest-seq
    restart: on-failure:5
    environment:
      ACCEPT_EULA: Y
    ports:
      - "127.0.0.1:5341:80"
    volumes:
      - seq-data:/data
    networks:
      - my-nest-network

networks:
  my-nest-network:
    external: true
    name: my-nest-network

volumes:
  seq-data:
